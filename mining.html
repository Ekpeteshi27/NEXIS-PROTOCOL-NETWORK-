<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexis Protocol | Mining Dashboard</title>

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- AdsGram SDK Script -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

    <!-- Monetag Domain Verification Tag -->
    <meta name="monetag" content="YOUR_VERIFICATION_CODE_HERE">

    <!-- Monetag In-Page Push / Anti-Adblock Native Script -->
    <script src="https://3nbf4.com/act/files/tag.min.js?z=12141446" data-cfasync="false" async></script>

    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #111827;
            --card-border: #1f2937;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --warning: #f59e0b;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .dashboard-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 40px;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 12px 16px;
        }

        .user-greeting {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            gap: 6px;
        }

        .nav-btn {
            background-color: #1a2234;
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
        }

        .announcement-banner {
            background-color: #1e3a8a;
            border: 1px solid #3b82f6;
            border-radius: 14px;
            padding: 12px 16px;
            font-size: 0.85rem;
            color: var(--text-main);
            line-height: 1.4;
            display: none;
            text-align: left;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }

        .balance-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .balance-value {
            font-size: 2.5rem;
            font-weight: 800;
            margin: 6px 0;
            color: var(--success);
        }

        .rig-box {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }

        .timer-display {
            font-size: 2rem;
            font-weight: 700;
            margin: 10px 0;
            color: var(--warning);
            font-family: monospace;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 14px;
        }

        .stat-card {
            background-color: #1a2234;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .stat-value {
            font-size: 1rem;
            font-weight: 700;
            margin-top: 4px;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 12px;
        }

        .btn:active {
            background-color: var(--accent-hover);
        }

        .btn:disabled {
            background-color: #374151;
            color: #6b7280;
            cursor: not-allowed;
        }

        /* Blue Boost Button Style */
        .btn-boost {
            background-color: var(--accent);
            color: #ffffff;
            border: 1px solid #60a5fa;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35);
        }

        .btn-boost:active {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- Navigation Header -->
        <div class="nav-bar">
            <div class="user-greeting" id="username-display">Miner</div>
            <div class="nav-links">
                <a href="tasks.html" class="nav-btn">Tasks</a>
                <a href="referral.html" class="nav-btn">Friends</a>
                <button class="nav-btn" onclick="logout()">Logout</button>
            </div>
        </div>

        <!-- Broadcast Announcement Box (Displays on both Web & Telegram) -->
        <div class="announcement-banner" id="announcement-banner">
            📢 <span id="announcement-text"></span>
        </div>

        <!-- Balance Card -->
        <div class="card">
            <div class="balance-label">Total Balance</div>
            <div class="balance-value" id="user-balance">0.00</div>
            <div style="font-size: 0.85rem; color: var(--accent); font-weight: 600;">$NEXIS Protocol</div>
        </div>

        <!-- Mining Rig Box -->
        <div class="rig-box">
            <div class="balance-label">12-Hour Mining Cycle</div>
            <div class="timer-display" id="timer-text">12:00:00</div>
            <p id="rig-status" style="font-size: 0.85rem; color: var(--text-muted); margin: 0;">Mining session active...</p>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Mining Speed</div>
                    <div class="stat-value" id="speed-display">0.50 / hr</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Cycle Earned</div>
                    <div class="stat-value" id="cycle-earned">0.00 $NEX</div>
                </div>
            </div>

            <button class="btn" id="claim-btn" onclick="claimCycle()" disabled>Claim & Restart Cycle</button>
        </div>

        <!-- Ad Boost Section -->
        <div class="card">
            <div class="balance-label" style="margin-bottom: 8px;">Ad Boost & Daily Reward</div>
            <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0;">Watch a sponsored ad to claim <strong>+2.0 $NEXIS</strong> and boost your speed by <strong>+0.25 /hr</strong>!</p>
            <button class="btn btn-boost" onclick="watchBoostAd()">Watch Ad & Earn Bonus $NEXIS</button>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW Fail:', err));
        }

        // Expand Telegram WebApp immediately if opened in Telegram
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Persistent session verification
        let userId = localStorage.getItem('nexis_user_id');
        let username = localStorage.getItem('nexis_logged_username');

        if (!userId) {
            if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                const tgUser = tg.initDataUnsafe.user;
                userId = 'tg_' + tgUser.id;
                username = tgUser.username || tgUser.first_name || 'TelegramMiner';
                localStorage.setItem('nexis_user_id', userId);
                localStorage.setItem('nexis_logged_username', username);
            } else {
                window.location.replace("index.html");
            }
        }

        document.getElementById('username-display').innerText = "@" + (username || "Miner");

        let balanceKey = 'nexis_balance_' + userId;
        let speedKey = 'nexis_speed_' + userId;
        let sessionKey = 'nexis_mining_session_' + userId;

        let balance = parseFloat(localStorage.getItem(balanceKey)) || 0.00;
        let miningSpeed = parseFloat(localStorage.getItem(speedKey));
        
        if (isNaN(miningSpeed)) {
            let globalBaseRate = parseFloat(localStorage.getItem('nexis_global_rate')) || 0.5;
            miningSpeed = globalBaseRate;
            localStorage.setItem(speedKey, miningSpeed);
        }

        // 12-Hour Mining Duration in Milliseconds
        const MINING_DURATION_MS = 12 * 60 * 60 * 1000;

        // Render Admin Announcements on both Web & Telegram
        function checkAnnouncement() {
            let msg = localStorage.getItem('nexis_announcement');
            let banner = document.getElementById('announcement-banner');
            let textSpan = document.getElementById('announcement-text');

            if (msg && msg.trim() !== '') {
                textSpan.innerText = msg;
                banner.style.display = 'block';
            } else {
                banner.style.display = 'none';
            }
        }

        // Persistent UTC Timestamp Mining Session
        function getMiningSession() {
            let raw = localStorage.getItem(sessionKey);
            let session = null;
            if (raw) {
                try {
                    session = JSON.parse(raw);
                } catch (e) {
                    session = null;
                }
            }

            if (!session || typeof session.endTime !== 'number') {
                session = { endTime: Date.now() + MINING_DURATION_MS };
                localStorage.setItem(sessionKey, JSON.stringify(session));
            }
            return session;
        }

        function updateUI() {
            // Re-sync balance in case of referral or task updates
            balance = parseFloat(localStorage.getItem(balanceKey)) || balance;
            document.getElementById('user-balance').innerText = balance.toFixed(2);
            document.getElementById('speed-display').innerText = miningSpeed.toFixed(2) + " / hr";

            let session = getMiningSession();
            let now = Date.now();
            let timeLeftMs = session.endTime - now;

            if (timeLeftMs <= 0) {
                document.getElementById('timer-text').innerText = "00:00:00";
                document.getElementById('cycle-earned').innerText = (12 * miningSpeed).toFixed(2) + " $NEX";
                document.getElementById('rig-status').innerText = "Mining cycle completed! Claim your tokens.";
                document.getElementById('claim-btn').disabled = false;
            } else {
                let timeLeftSec = Math.floor(timeLeftMs / 1000);
                let hours = Math.floor(timeLeftSec / 3600);
                let minutes = Math.floor((timeLeftSec % 3600) / 60);
                let seconds = timeLeftSec % 60;

                document.getElementById('timer-text').innerText = 
                    `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                
                let elapsedHours = (MINING_DURATION_MS - timeLeftMs) / (1000 * 3600);
                let currentCycleMined = Math.max(0, elapsedHours * miningSpeed);
                document.getElementById('cycle-earned').innerText = currentCycleMined.toFixed(2) + " $NEX";

                document.getElementById('rig-status').innerText = "Mining session active...";
                document.getElementById('claim-btn').disabled = true;
            }
        }

        // Update UI every second & whenever app returns to foreground
        setInterval(updateUI, 1000);
        document.addEventListener("visibilitychange", () => {
            if (!document.hidden) {
                checkAnnouncement();
                updateUI();
            }
        });

        function claimCycle() {
            let earnedTotal = 12 * miningSpeed;
            balance += earnedTotal;
            localStorage.setItem(balanceKey, balance);

            let newEndTime = Date.now() + MINING_DURATION_MS;
            localStorage.setItem(sessionKey, JSON.stringify({ endTime: newEndTime }));

            updateUI();
            alert(`Successfully claimed ${earnedTotal.toFixed(2)} $NEXIS! New 12-hour cycle started.`);
        }

        // Programmatic AdsGram / Monetag Ad Boost
        function watchBoostAd() {
            let adsgramBlockId = localStorage.getItem('nexis_adsgram_block') || "";
            let monetagFallbackUrl = "https://uplcm.com/4/12141542";

            if (window.Telegram?.WebApp && window.Adsgram && adsgramBlockId.trim() !== "") {
                window.Adsgram.init({ blockId: adsgramBlockId }).show()
                    .then(() => {
                        grantBoostReward();
                    })
                    .catch((result) => {
                        console.log("AdsGram fallback:", result);
                        grantBoostReward();
                        window.location.href = monetagFallbackUrl;
                    });
            } else {
                grantBoostReward();
                window.location.href = monetagFallbackUrl;
            }
        }

        function grantBoostReward() {
            balance += 2.0;
            miningSpeed += 0.25;

            localStorage.setItem(balanceKey, balance);
            localStorage.setItem(speedKey, miningSpeed);
            updateUI();
        }

        function logout() {
            localStorage.removeItem('nexis_user_id');
            localStorage.removeItem('nexis_logged_username');
            window.location.replace("index.html");
        }

        checkAnnouncement();
        updateUI();
    </script>
</body>
</html>
