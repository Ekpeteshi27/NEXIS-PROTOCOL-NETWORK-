<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexis Protocol | Referral Program</title>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #111827;
            --card-border: #1f2937;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .ref-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 40px;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 12px 16px;
        }

        .nav-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .nav-btn {
            background-color: #1a2234;
            color: var(--accent);
            border: 1px solid var(--card-border);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }

        .card-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 12px;
        }

        .stat-card {
            background-color: #1a2234;
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: 800;
            margin-top: 4px;
            color: var(--success);
        }

        .ref-box {
            background-color: #1a2234;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px;
            font-size: 0.85rem;
            word-break: break-all;
            color: var(--text-main);
            margin: 12px 0;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:active {
            background-color: var(--accent-hover);
        }

        .info-banner {
            background-color: #1e3a8a;
            border: 1px solid #3b82f6;
            border-radius: 14px;
            padding: 14px;
            font-size: 0.85rem;
            text-align: left;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="ref-container">
        <!-- Navigation Header -->
        <div class="nav-bar">
            <div class="nav-title">Invite & Earn</div>
            <a href="mining.html" class="nav-btn">← Dashboard</a>
        </div>

        <!-- System Overview Banner -->
        <div class="info-banner">
            <strong>🚀 5% Commission Program</strong><br>
            Invite friends to Nexis Protocol. Earn <strong>5 $NEXIS</strong> instantly per referral plus <strong>5% bonus commission</strong> on all earnings generated by your network!
        </div>

        <!-- Referral Stats Grid -->
        <div class="card">
            <div class="card-title">Your Network Overview</div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Total Friends</div>
                    <div class="stat-value" id="ref-count">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">5% Earned</div>
                    <div class="stat-value" id="ref-earned">0.00 $NEX</div>
                </div>
            </div>
        </div>

        <!-- Link Generator Card -->
        <div class="card">
            <div class="card-title">Your Web Referral Link</div>
            <div class="ref-box" id="ref-link">Generating link...</div>
            <button class="btn" onclick="copyReferralLink()">Copy Web Link</button>
        </div>
    </div>

    <script>
        // Retrieve Active User Session
        let loggedEmail = localStorage.getItem('nexis_logged_email');
        let loggedUsername = localStorage.getItem('nexis_logged_username');

        if (!loggedEmail) {
            window.location.href = "index.html";
        }

        // Generate or fetch user referral key
        let userRefCode = localStorage.getItem('nexis_ref_code_' + loggedEmail);
        if (!userRefCode) {
            userRefCode = (loggedUsername || 'user') + '_' + Math.random().toString(36).substring(2, 6);
            localStorage.setItem('nexis_ref_code_' + loggedEmail, userRefCode);
        }

        // Generate Direct Web App Link pointing straight to platform registration
        let baseUrl = window.location.origin;
        let fullRefLink = `${baseUrl}/index.html?ref=${userRefCode}`;
        document.getElementById('ref-link').innerText = fullRefLink;

        // Load Referral Data
        let invitedFriends = parseInt(localStorage.getItem('nexis_ref_count_' + loggedEmail)) || 0;
        let referralEarned = parseFloat(localStorage.getItem('nexis_ref_earned_' + loggedEmail)) || 0.00;

        document.getElementById('ref-count').innerText = invitedFriends;
        document.getElementById('ref-earned').innerText = referralEarned.toFixed(2) + " $NEX";

        // Copy Link Action
        function copyReferralLink() {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(fullRefLink).then(() => {
                    alert("Web referral link copied to clipboard!");
                }).catch(() => {
                    fallbackCopy(fullRefLink);
                });
            } else {
                fallbackCopy(fullRefLink);
            }
        }

        function fallbackCopy(text) {
            let textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                alert("Web referral link copied!");
            } catch (err) {
                prompt("Copy link manually:", text);
            }
            document.body.removeChild(textArea);
        }
    </script>
</body>
</html>
