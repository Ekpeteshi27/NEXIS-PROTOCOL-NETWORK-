<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexis Protocol | Earning Tasks</title>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #111827;
            --card-border: #1f2937;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .tasks-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 40px;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 12px 16px;
        }

        .nav-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .nav-btn {
            background-color: #1a2234;
            color: var(--accent);
            border: 1px solid var(--card-border);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
        }

        .balance-strip {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-details h4 {
            margin: 0 0 4px 0;
            font-size: 0.95rem;
        }

        .task-details p {
            margin: 0;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .reward-badge {
            color: var(--success);
            font-weight: 700;
            font-size: 0.85rem;
            margin-top: 4px;
            display: block;
        }

        .task-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .task-btn:disabled {
            background-color: #1f2937;
            color: var(--text-muted);
            cursor: not-allowed;
            border: 1px solid var(--card-border);
        }
    </style>
</head>
<body>

    <div class="tasks-container">
        <!-- Nav -->
        <div class="nav-bar">
            <div class="nav-title">Earning Tasks</div>
            <a href="mining.html" class="nav-btn">← Dashboard</a>
        </div>

        <!-- Balance Header -->
        <div class="balance-strip">
            <span style="font-size:0.85rem; color:var(--text-muted);">Current Balance</span>
            <span style="font-size:1.1rem; font-weight:800; color:var(--success);" id="user-balance">0.00 $NEX</span>
        </div>

        <!-- Dynamic Admin Tasks List Container -->
        <div id="dynamic-tasks-list" style="display: flex; flex-direction: column; gap: 12px;">
            <!-- Rendered via JavaScript -->
        </div>
    </div>

    <script>
        let loggedEmail = localStorage.getItem('nexis_logged_email');
        if (!loggedEmail) {
            window.location.href = "index.html";
        }

        let balanceKey = 'nexis_balance_' + loggedEmail;
        let balance = parseFloat(localStorage.getItem(balanceKey)) || 0.00;

        function updateUI() {
            document.getElementById('user-balance').innerText = balance.toFixed(2) + " $NEX";
            renderTasks();
        }

        function renderTasks() {
            let tasks = JSON.parse(localStorage.getItem('nexis_admin_tasks')) || [];
            let container = document.getElementById('dynamic-tasks-list');

            if (tasks.length === 0) {
                container.innerHTML = `
                    <div class="task-card" style="text-align: center; justify-content: center;">
                        <p style="color: var(--text-muted); font-size: 0.85rem; margin: 0;">No active tasks available right now. Check back later!</p>
                    </div>
                `;
                return;
            }

            let html = '';
            tasks.forEach((task) => {
                let userTaskKey = task.id + '_' + loggedEmail;
                let isCompleted = localStorage.getItem(userTaskKey) === 'done';

                html += `
                    <div class="task-card">
                        <div class="task-details">
                            <h4>${task.title}</h4>
                            <p>${task.desc}</p>
                            <span class="reward-badge">+${task.reward.toFixed(2)} $NEXIS</span>
                        </div>
                        <button class="task-btn" id="btn_${task.id}" 
                            ${isCompleted ? 'disabled' : ''} 
                            onclick="completeTask('${task.id}', ${task.reward}, '${task.url}')">
                            ${isCompleted ? 'Completed' : 'Start'}
                        </button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function completeTask(taskId, reward, url) {
            // Open admin-set link in a new tab
            window.open(url, '_blank');

            setTimeout(() => {
                balance += reward;
                localStorage.setItem(balanceKey, balance);
                
                // Mark complete for this specific user
                let userTaskKey = taskId + '_' + loggedEmail;
                localStorage.setItem(userTaskKey, 'done');
                
                updateUI();
                alert(`Task completed! +${reward.toFixed(2)} $NEXIS added to your balance.`);
            }, 3000);
        }

        updateUI();
    </script>
</body>
</html>
