<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexis Protocol | Account Access</title>

    <!-- Monetag Domain Verification Tag -->
    <meta name="monetag" content="YOUR_VERIFICATION_CODE_HERE">

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Monetag In-Page Push / Anti-Adblock Native Script -->
    <script src="https://3nbf4.com/act/files/tag.min.js?z=12141446" data-cfasync="false" async></script>

    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #111827;
            --card-border: #1f2937;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .auth-container {
            width: 100%;
            max-width: 380px;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .logo-area {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo-area h1 {
            font-size: 1.6rem;
            margin: 0;
            background: linear-gradient(to right, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-area p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin: 6px 0 0 0;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            background-color: #1a2234;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px;
            color: var(--text-main);
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: var(--accent);
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 8px;
        }

        .btn:active {
            background-color: var(--accent-hover);
        }

        .toggle-text {
            text-align: center;
            margin-top: 16px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .toggle-text span {
            color: var(--accent);
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="logo-area">
            <h1>Nexis Protocol</h1>
            <p id="form-subtitle">Create your cloud mining account</p>
        </div>

        <form id="auth-form" onsubmit="handleAuth(event)">
            <div class="form-group" id="username-group">
                <label class="form-label">Username</label>
                <input type="text" id="username" class="form-input" placeholder="Choose a username" required>
            </div>

            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" id="email" class="form-input" placeholder="name@gmail.com" required>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-input" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn" id="submit-btn">Register Account</button>
        </form>

        <div class="toggle-text">
            <span id="toggle-link" onclick="toggleMode()">Already have an account? Login</span>
        </div>
    </div>

    <script>
        let isLoginMode = false;

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW Fail:', err));
        }

        // Immediately check for persistent session before rendering login form
        (function checkExistingSession() {
            captureReferral();

            // 1. Check if already logged in via Web or previous Telegram session
            const existingUserId = localStorage.getItem('nexis_user_id');
            if (existingUserId) {
                window.location.replace("mining.html");
                return;
            }

            // 2. Check Telegram Mini App auto-login
            const tg = window.Telegram?.WebApp;
            if (tg) {
                tg.ready();
                tg.expand();
            }

            if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                const tgUser = tg.initDataUnsafe.user;
                const userId = 'tg_' + tgUser.id;
                const username = tgUser.username || tgUser.first_name || 'TelegramMiner';

                localStorage.setItem('nexis_user_id', userId);
                localStorage.setItem('nexis_logged_username', username);

                if (!localStorage.getItem('nexis_balance_' + userId)) {
                    localStorage.setItem('nexis_balance_' + userId, '0.00');
                    let globalRate = parseFloat(localStorage.getItem('nexis_global_rate')) || 0.5;
                    localStorage.setItem('nexis_speed_' + userId, globalRate);
                }

                processPendingReferral(userId);
                window.location.replace("mining.html");
            }
        })();

        function captureReferral() {
            const urlParams = new URLSearchParams(window.location.search);
            const ref = urlParams.get('ref');
            if (ref) {
                localStorage.setItem('nexis_pending_ref', ref);
            }
        }

        function processPendingReferral(newUserId) {
            let pendingRef = localStorage.getItem('nexis_pending_ref');
            if (pendingRef) {
                // Resolve referral code to inviter's userId if mapped, otherwise use raw code
                let inviterId = localStorage.getItem('nexis_ref_lookup_' + pendingRef) || pendingRef;

                if (inviterId !== newUserId) {
                    let refKey = 'nexis_referrals_' + inviterId;
                    let referrals = JSON.parse(localStorage.getItem(refKey) || '[]');
                    if (!referrals.includes(newUserId)) {
                        referrals.push(newUserId);
                        localStorage.setItem(refKey, JSON.stringify(referrals));

                        let countKey = 'nexis_ref_count_' + inviterId;
                        let currentCount = parseInt(localStorage.getItem(countKey)) || 0;
                        localStorage.setItem(countKey, currentCount + 1);

                        let earnedKey = 'nexis_ref_earned_' + inviterId;
                        let currentEarned = parseFloat(localStorage.getItem(earnedKey)) || 0.00;
                        localStorage.setItem(earnedKey, currentEarned + 5.00);

                        // Also add bonus directly to inviter's main balance
                        let inviterBalKey = 'nexis_balance_' + inviterId;
                        let inviterBal = parseFloat(localStorage.getItem(inviterBalKey)) || 0.00;
                        localStorage.setItem(inviterBalKey, inviterBal + 5.00);
                    }
                }
                localStorage.removeItem('nexis_pending_ref');
            }
        }

        function toggleMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('form-subtitle').innerText = isLoginMode ? "Login to your mining account" : "Create your cloud mining account";
            document.getElementById('submit-btn').innerText = isLoginMode ? "Login" : "Register Account";
            
            let userGroup = document.getElementById('username-group');
            let userField = document.getElementById('username');
            
            if (isLoginMode) {
                userGroup.style.display = "none";
                userField.removeAttribute('required');
            } else {
                userGroup.style.display = "block";
                userField.setAttribute('required', 'true');
            }

            document.getElementById('toggle-link').innerText = isLoginMode ? "Need an account? Register" : "Already have an account? Login";
        }

        function handleAuth(event) {
            event.preventDefault();
            let email = document.getElementById('email').value.trim().toLowerCase();
            let password = document.getElementById('password').value.trim();
            let userId = 'web_' + email.replace(/[^a-zA-Z0-9]/g, '_');

            if (isLoginMode) {
                let savedPass = localStorage.getItem('nexis_pass_' + userId);
                let savedUser = localStorage.getItem('nexis_user_' + userId);

                if (!savedPass) {
                    alert("No account found with this email! Please register first.");
                    return;
                }
                if (savedPass !== password) {
                    alert("Incorrect password!");
                    return;
                }

                localStorage.setItem('nexis_user_id', userId);
                localStorage.setItem('nexis_logged_username', savedUser);
            } else {
                let username = document.getElementById('username').value.trim();
                if (!username) {
                    alert("Please enter a username.");
                    return;
                }

                if (localStorage.getItem('nexis_pass_' + userId)) {
                    alert("Account already exists with this email! Please login.");
                    return;
                }

                localStorage.setItem('nexis_user_' + userId, username);
                localStorage.setItem('nexis_pass_' + userId, password);
                localStorage.setItem('nexis_user_id', userId);
                localStorage.setItem('nexis_logged_username', username);
                
                if (!localStorage.getItem('nexis_balance_' + userId)) {
                    localStorage.setItem('nexis_balance_' + userId, '0.00');
                    let globalRate = parseFloat(localStorage.getItem('nexis_global_rate')) || 0.5;
                    localStorage.setItem('nexis_speed_' + userId, globalRate);
                }

                processPendingReferral(userId);
            }

            window.location.replace("mining.html");
        }
    </script>
</body>
</html>
